[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openscore-converter"
version = "0.0.1"
description = "An open-source music score conversion and editing project."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "GPL-3.0-only"}
authors = [{name = "OpenScore Converter contributors"}]
keywords = ["midi", "musicxml", "sheet-music", "music-notation", "qt"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "PySide6>=6.10,<7",
]

[project.scripts]
openscore = "openscore.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openscore = ["assets/*.svg"]
